server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location /content/ {
        expires -1;
        try_files $uri =404;
    }
    location /images/ {
        expires 1h;
        try_files $uri =404;
    }
    # Existing pages use prerendered HTML. New JSON-only projects can use the SPA fallback.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
